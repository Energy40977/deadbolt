# Actions are pinned by commit rather than by tag. A tag is mutable: whoever owns
# the action can move it, and a moved tag runs their code with this workflow's
# token. Dependabot keeps these commits current, which is the trade this makes —
# an update you review instead of an update you never see. deadbolt reports the
# tag form as DB-SUP-001, and it applies to its own pipeline.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started from the Actions tab without an empty commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege at the workflow level. Without this block a job receives the
# default token scope, which on a public repository is read-only but on a private
# one is write — a compromised action would then be able to push. The one job that
# needs more says so itself.
permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Formatting and lints are cheap and fail fast, so they run first.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release

  self-audit:
    # deadbolt has to survive its own rules. A scanner that cannot pass itself is
    # not a scanner anybody should adopt.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only this job writes, and only to code scanning, for the SARIF upload.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build
        run: cargo build --release

      # Offline and without the AI layer: this job must be deterministic and must
      # not depend on a network service or on model availability.
      #
      # Exit codes are handled explicitly, which is the same advice this tool gives
      # its own users. Offline is deliberate here, so code 3 (a phase did not run)
      # is expected and must not fail the build; 1 and 2 must.
      - name: Audit itself
        run: |
          set +e
          ./target/release/deadbolt audit . \
            --no-ai --offline \
            --format terminal,sarif \
            --out ./audit \
            --fail-on critical
          code=$?
          set -e
          case "$code" in
            0) echo "clean" ;;
            3) echo "::warning::deadbolt ran degraded (offline by design): dependency and AI phases were skipped" ;;
            *) echo "::error::deadbolt exited $code"; exit "$code" ;;
          esac

      # Code scanning is unavailable on a private repository without Advanced
      # Security, so a missing entitlement must not fail the audit that produced
      # the file. The artefact below is the fallback.
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: ./audit/deadbolt.sarif

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deadbolt-self-audit
          path: ./audit/
