name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started from the Actions tab without an empty commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting and lints are cheap and fail fast, so they run first.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release

  self-audit:
    # deadbolt has to survive its own rules. A scanner that cannot pass itself is
    # not a scanner anybody should adopt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # Offline and without the AI layer: this job must be deterministic and must
      # not depend on a network service or on model availability.
      - name: Audit itself
        run: |
          ./target/release/deadbolt audit . \
            --no-ai --offline \
            --format terminal,sarif \
            --out ./audit \
            --fail-on critical

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./audit/deadbolt.sarif

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadbolt-self-audit
          path: ./audit/
