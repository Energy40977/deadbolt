<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80"
     role="img" aria-label="deadbolt — security and compliance audit">
  <rect width="360" height="80" fill="#04070a"/>
  <g transform="translate(8 8)" fill="none" stroke="#00ff9c" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">


  <!-- board traces feeding the skull -->
  <g stroke-width="1.3" opacity="0.8">
    <path d="M2 22h5M2 22v-7h7"/>
    <path d="M62 22h-5M62 22v-7h-7"/>
    <path d="M4 45h6M60 45h-6"/>
    <circle cx="9" cy="15" r="1.5" fill="#00ff9c" stroke="none"/>
    <circle cx="55" cy="15" r="1.5" fill="#00ff9c" stroke="none"/>
    <circle cx="4" cy="45" r="1.5" fill="#00ff9c" stroke="none"/>
    <circle cx="60" cy="45" r="1.5" fill="#00ff9c" stroke="none"/>
  </g>

  <!-- cranium, pinched at the temples, tapering to the jaw -->
  <path d="M32 6.5c-11 0-18.8 7.6-18.8 18v6.2c0 2.3 1.1 4.4 3 5.6l2.3 1.4c.7.4 1.1 1.2 1.1 2v3.1
           c0 3 2.4 5.4 5.4 5.4h13.9c3 0 5.4-2.4 5.4-5.4v-3.1c0-.8.4-1.6 1.1-2l2.3-1.4
           c1.9-1.2 3-3.3 3-5.6V24.5c0-10.4-7.8-18-18.7-18z"/>

  <!-- circuit on the skullcap -->
  <g stroke-width="1.15" opacity="0.9">
    <path d="M19.5 14.5h8.5v-3.5"/>
    <path d="M44.5 14.5H36v-3.5"/>
    <circle cx="28" cy="10.6" r="1.2" fill="#00ff9c" stroke="none"/>
    <circle cx="36" cy="10.6" r="1.2" fill="#00ff9c" stroke="none"/>
  </g>

  <!-- deadbolt keyhole in the frontal bone -->
  <circle cx="32" cy="17.6" r="2.5"/>
  <path d="M30.6 21.4h2.8l-.7 3.1h-1.4z" fill="#00ff9c" stroke="none"/>

  <!-- eye sockets: hex bays angled inward -->
  <path d="M17.6 25.6l3.4-2.6 7.6 1.4 1.1 5.3-3.4 3.4-7.6-1.6z" fill="#00ff9c" stroke="none"/>
  <path d="M46.4 25.6L43 23l-7.6 1.4-1.1 5.3 3.4 3.4 7.6-1.6z" fill="#00ff9c" stroke="none"/>
  <g stroke="#04070a" stroke-width="1" opacity="0.65">
    <path d="M19.4 28.6l8.2 1.4M44.6 28.6l-8.2 1.4"/>
  </g>

  <!-- nasal aperture -->
  <path d="M32 34.8l-2.4 4.8h4.8z" fill="#00ff9c" stroke="none"/>

  <!-- upper jaw line + teeth as pins -->
  <path d="M23.5 43.5h17"/>
  <g stroke-width="1.5">
    <path d="M26.7 43.5v4.6M30.2 43.5v4.6M33.8 43.5v4.6M37.3 43.5v4.6"/>
  </g>

  <!-- traces leaving the mandible -->
  <g stroke-width="1.3" opacity="0.8">
    <path d="M23.6 48.6l-4 4.4h-5.2"/>
    <path d="M40.4 48.6l4 4.4h5.2"/>
    <circle cx="14.4" cy="53" r="1.5" fill="#00ff9c" stroke="none"/>
    <circle cx="49.6" cy="53" r="1.5" fill="#00ff9c" stroke="none"/>
  </g>

  <!-- temple vias -->
  <g stroke-width="1.15" opacity="0.85">
    <path d="M13.2 33h-2.6M50.8 33h2.6"/>
    <circle cx="10.6" cy="33" r="1.2" fill="#00ff9c" stroke="none"/>
    <circle cx="53.4" cy="33" r="1.2" fill="#00ff9c" stroke="none"/>
  </g>

  <!-- target brackets -->
  <g stroke-width="1.6" opacity="0.65">
    <path d="M2 9V2h7M55 2h7v7M62 55v7h-7M9 62H2v-7"/>
  </g>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#00ff9c">
    <text x="88" y="40" font-size="30" font-weight="700" letter-spacing="4.5">DEADBOLT</text>
    <text x="90" y="58" font-size="9" letter-spacing="2.4" fill="#4e7f63">SECURITY AUDIT FOR ANY CODEBASE</text>
  </g>
  <g stroke="#00ff9c" stroke-width="1.6" opacity="0.6" fill="none">
    <path d="M2 10V2h8M350 2h8v8M358 70v8h-8M10 78H2v-8"/>
  </g>
</svg>
